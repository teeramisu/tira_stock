[pytest]
# 已知失败用 @pytest.mark.xfail(strict=False)；nightly 用 --runxfail 追踪真实状态
pythonpath = backend
markers =
    performance: performance benchmark tests, excluded in quick CI
    network: tests requiring external network access
    integration: slower integration tests
    requires_data: 依赖本地 data/ 数据集；干净 checkout 自动 skip
addopts = -m "not performance and not network and not integration"
