# Nginx configuration for stock_backtest with SSL
server {
    listen 80;
    server_name openquant.club www.openquant.club;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name openquant.club www.openquant.club;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/openquant.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openquant.club/privkey.pem;
    
    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Location blocks
    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # Optional: Serve static files directly if you build frontend separately
    # location /static/ {
    #     alias /app/frontend/;
    # }
}