name: CI

# 分层验证管线（静态 → 单元/集成 → 前端 → 元信息 → 单一闸门）
# 设计说明见 docs/ci.md

on:
  # 不限制 base 分支：stacked PR（如 ci → feature）也要能触发
  pull_request:
  push:
    branches: [main]
  # Merge Queue：在「base + 队列中前面的 PR」组合上重跑必需检查
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# 同一分支连续推送时取消旧运行，省 runner 也省等待
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------- 0. 变更面
  plan:
    name: 变更面探测
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
      ci: ${{ steps.areas.outputs.ci }}
      deps: ${{ steps.areas.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 计算受影响区域
        id: areas
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="origin/${{ github.base_ref }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            base="${{ github.event.merge_group.base_sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            git rev-parse --verify --quiet "$base" >/dev/null || base="HEAD~1"
          else
            base="HEAD~1"
          fi
          python scripts/ci/changed_areas.py --base "$base" | tee /tmp/areas.txt
          grep -E '^(backend|frontend|ci|deps|count)=' /tmp/areas.txt >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- 1. 静态层
  static:
    name: 静态分析
    needs: plan
    if: needs.plan.outputs.backend == 'true' || needs.plan.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt

      - name: 阻断规则（未定义名 / 语法错 / 无效比较）
        run: python -m ruff check backend scripts --output-format=github

      - name: Lint 债务 ratchet
        run: python scripts/ci/lint_ratchet.py

      - name: 字节码编译（捕获语法层面的隐性坏文件）
        run: python -m compileall -q backend scripts

      - name: 仓库卫生
        run: python scripts/ci/check_hygiene.py

      - name: 密钥扫描
        run: python scripts/ci/check_secrets.py

      - name: 分层边界
        run: python scripts/ci/check_layers.py

      - name: 应用可导入（FastAPI app 装配成功）
        run: python -c "import sys; sys.path.insert(0,'backend'); import app.main; print('app import ok')"
        env:
          ENV: ci

  # ---------------------------------------------------------------- 1.5 Google 风格
  style:
    name: Google 风格（新增行）
    needs: plan
    if: needs.plan.outputs.backend == 'true' || needs.plan.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt

      - name: 计算 diff 区间
        id: range
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            echo "base=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.merge_group.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 只检查新增行（旧债不背）
        run: |
          python scripts/ci/check_style.py \
            --base "${{ steps.range.outputs.base }}" \
            --head "${{ steps.range.outputs.head }}"

  # ---------------------------------------------------------------- 2. 测试主体
  tests:
    name: 测试 / ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.backend == 'true' || needs.plan.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [macro-discovery, engine, portfolio, marketdata]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt

      - name: 分片表完整性（新增测试文件必须登记）
        run: python scripts/ci/shard_tests.py --validate

      - name: 运行分片（失败自动重跑一次，区分偶发）
        run: |
          set -euo pipefail
          files=$(python scripts/ci/shard_tests.py --list "${{ matrix.shard }}" | tr '\n' ' ')
          echo "目标文件: $files"
          python scripts/ci/run_tests.py $files

      - name: 偶发失败明细写进 Summary
        if: always()
        run: |
          if [[ -f /tmp/flaky-summary.md ]]; then
            cat /tmp/flaky-summary.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> 第 1 次失败、重跑通过；本次未阻断，但请尽快消除不确定性。" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------- 2.5 覆盖率
  coverage:
    name: 覆盖率 ratchet
    needs: plan
    if: needs.plan.outputs.backend == 'true' || needs.plan.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt

      - name: 跑测试并统计覆盖率
        run: |
          python -m pytest backend/tests -q -p no:cacheprovider \
            --cov=backend --cov-report=json:coverage.json --cov-report=term:skip-covered

      - name: 覆盖率只许升
        run: python scripts/ci/check_coverage.py --report coverage.json

      - name: 保存覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json
          retention-days: 14

  # ---------------------------------------------------------------- 2.8 依赖审计
  dependencies:
    name: 依赖漏洞审计
    needs: plan
    if: needs.plan.outputs.deps == 'true' || needs.plan.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: 安装 pip-audit
        run: pip install pip-audit
      - name: 审计 requirements-ci.txt
        run: python scripts/ci/check_dependencies.py --requirements requirements-ci.txt
      - name: 审计 requirements.txt
        if: always()
        run: |
          if [[ -f requirements.txt ]]; then
            python scripts/ci/check_dependencies.py --requirements requirements.txt || true
          fi

  # ---------------------------------------------------------------- 3. 前端
  frontend:
    name: 前端语法与资源
    needs: plan
    if: needs.plan.outputs.frontend == 'true' || needs.plan.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: node --check + 资源引用
        run: python scripts/ci/check_frontend.py

  # ---------------------------------------------------------------- 4. 提交规范
  commits:
    name: 提交规范
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 分支命名
        run: python scripts/ci/check_commits.py --branch "${{ github.head_ref }}"

      - name: 提交信息（Conventional Commits）
        run: |
          python scripts/ci/check_commits.py \
            --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  # ---------------------------------------------------------------- 5. PR 门禁
  pr-meta:
    name: PR 元信息
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 标题 + 描述结构 + 回退说明
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python scripts/ci/check_pr_meta.py --title "$TITLE" --body "$BODY" --labels "$LABELS"

  pr-scope:
    name: PR 范围（一件事）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 功能区跨度
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python scripts/ci/check_pr_scope.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --labels "$LABELS"

  pr-size:
    name: PR 体量预算
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 文件数与改动行数
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python scripts/ci/check_pr_size.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --labels "$LABELS"

  # ---------------------------------------------------------------- 5. 单一闸门
  gate:
    name: CI 汇总
    if: always()
    needs: [plan, static, style, tests, coverage, dependencies, frontend, commits, pr-meta, pr-scope, pr-size]
    runs-on: ubuntu-latest
    steps:
      - name: 汇总各层结果
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] in {"failure", "cancelled"}}
          for name, result in needs.items():
              print(f"{name:<12} {result}")
          if bad:
              print("\n❌ 有阻断项失败：", bad)
              sys.exit(1)
          print("\n✅ 所有需要的层级均通过（skipped 视为按变更面主动跳过）")
          PY

      - name: 说明
        run: |
          echo "这是分支保护建议设置成 required 的唯一检查项，避免每次加 job 都要改保护规则。"
